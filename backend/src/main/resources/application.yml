
spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        createDatabaseIfNotExist: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: ${PORT:${SERVER_PORT:8081}}
  address: 0.0.0.0

  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  security:
    cross-site-cookies: ${CROSS_SITE_COOKIES:false}

  rate-limit:
    per-minute: ${RATE_LIMIT_PER_MINUTE:120}
    auth-per-minute: ${AUTH_RATE_LIMIT_AUTH_PER_MINUTE:${RATE_LIMIT_AUTH_PER_MINUTE:10}}

  portal:
    demo-payments: ${DEMO_PAYMENTS:false}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}

  student-mail:
    from: ${SMTP_FROM:}
